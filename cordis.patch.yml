# dsh-cli-bridge — the configuration layer this bundle contributes.
#
# `dsh plugin --profile <name> add dsh-cli-bridge` appends this bundle to the
# profile, and this patch inserts the plugin row below. Every field the plugin
# accepts has a working default, so the row needs no config at all; the
# commented block records what is available and where the defaults come from.
#
# To change something, copy the row into your profile's own
# `cordis.patch.yml` and override it there by id — a patch replaces a row's
# whole `config`, so restate every key you keep.

- insert:
    - id: cli-bridge
      name: dsh-cli-bridge
      # config:
