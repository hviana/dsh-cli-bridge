name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: version to release, e.g. 0.1.1
        type: string
        required: true

permissions:
  # Trusted publishing (OIDC): GitHub mints a short-lived identity token that
  # the npm registry exchanges against the trusted publisher on the package.
  id-token: write
  # The release-dispatch path bumps package.json, commits, and pushes the tag.
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bump version and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.version }}" --no-git-tag-version
          git add package.json
          git commit -m "${{ inputs.version }}"
          git tag -a "v${{ inputs.version }}" -m "v${{ inputs.version }}"
          git push origin HEAD --follow-tags

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 24 bundles an older npm.
      - name: update npm for trusted publishing
        run: npm install -g npm@latest

      - name: verify everything the tag claims
        run: pnpm run check

      - name: confirm the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $declared" >&2
            exit 1
          fi

      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        # Trusted publishing (OIDC): no token, provenance is automatic.
        run: npm publish --access public

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: '*.tgz'
