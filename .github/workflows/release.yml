name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: build and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read
  # Required for npm provenance: the registry records which workflow, at which
  # commit, produced the tarball.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: verify everything the tag claims
        run: pnpm run check

      - name: confirm the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $declared" >&2
            exit 1
          fi

      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: pack only
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: '*.tgz'
