name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: build and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC): GitHub mints a short-lived
  # identity token, and the npm registry exchanges it against the trusted
  # publisher configured on the package. No NPM_TOKEN is involved.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 24 bundles an older npm.
      - name: update npm for trusted publishing
        run: npm install -g npm@latest

      - name: verify everything the tag claims
        run: pnpm run check

      - name: confirm the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $declared" >&2
            exit 1
          fi

      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        # Trusted publishing (OIDC) needs no token: provenance is generated
        # automatically, and auth comes from the id-token above.
        run: npm publish --access public

      - name: pack only
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: '*.tgz'
