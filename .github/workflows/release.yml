name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: version to release, e.g. 0.1.1
        type: string
        required: true

permissions:
  # Trusted publishing (OIDC): GitHub mints a short-lived identity token that
  # the npm registry exchanges against the trusted publisher on the package.
  id-token: write
  # The release path bumps package.json, commits, and pushes the tag.
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bump version and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          current="$(node -p "require('./package.json').version")"
          if [ "$current" != "${{ inputs.version }}" ]; then
            npm version "${{ inputs.version }}" --no-git-tag-version
            git add package.json
            git commit -m "${{ inputs.version }}"
            git tag -a "v${{ inputs.version }}" -m "v${{ inputs.version }}"
            git push origin HEAD --follow-tags
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 24 bundles an older npm.
      - name: update npm for trusted publishing
        run: npm install -g npm@latest

      # The same run publishes: a tag pushed with GITHUB_TOKEN does NOT
      # re-trigger workflows, so the publish cannot depend on a second run.
      # prepublishOnly (npm run check) verifies and builds before packing.
      - name: publish
        run: npm publish --access public
